<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
	<!-- Blue gradient background -->
	<defs>
		<linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
		</linearGradient>
	</defs>
	
	<!-- Rounded background -->
	<rect width="120" height="120" rx="24" fill="url(#bgGradient)"/>
	
	<!-- Document icon -->
	<g transform="translate(30, 20)">
		<!-- Paper sheet -->
		<rect width="60" height="80" rx="4" fill="white" opacity="0.95"/>
		
		<!-- Header line -->
		<rect x="10" y="12" width="40" height="3" rx="1.5" fill="#2563EB"/>
		
		<!-- Content lines -->
		<rect x="10" y="22" width="40" height="2" rx="1" fill="#2563EB" opacity="0.6"/>
		<rect x="10" y="28" width="40" height="2" rx="1" fill="#2563EB" opacity="0.6"/>
		<rect x="10" y="34" width="35" height="2" rx="1" fill="#2563EB" opacity="0.6"/>
		
		<!-- Accent circle -->
		<circle cx="50" cy="55" r="10" fill="#FCD34D" opacity="0.9"/>
		<circle cx="50" cy="55" r="8" fill="#FCD34D"/>
	</g>
</svg>